<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CineTick</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <nav>
        <div class="logo">
            <a href="index.html" style="text-decoration:none; color:inherit;">CineTick</a>
        </div>
    </nav>
    
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="logo" style="display:block; text-align:center; margin-bottom: 2rem;">CineTick</div>
            <h2>Create Account</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:1rem; font-size:1.1rem; margin-top:1rem;">Sign Up</button>
                
                <div style="display: flex; align-items: center; margin: 1.5rem 0; color: #888; font-size: 0.9rem;">
                    <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
                    <span style="padding: 0 10px; color: var(--text-gray);">or</span>
                    <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
                </div>

                <button type="button" onclick="signInWithGoogle()" class="btn btn-outline" style="width:100%; padding:0.8rem; display:flex; align-items:center; justify-content:center; gap:10px; border-color:rgba(255,255,255,0.15); background:rgba(255,255,255,0.02); color:white; font-weight:600; border-radius:10px; cursor:pointer; transition:all 0.3s ease; margin-bottom: 1.5rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                    </svg>
                    Sign Up with Google
                </button>
            </form>
            <div class="auth-footer">
                Already have an account? <a href="login.html">Log In</a>
                <br><br>
                <a href="index.html" style="font-size:0.9rem; opacity:0.6;">Back to Home</a>
            </div>
        </div>
    </div>
    
    <div id="toast"></div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script type="module" src="js/firebase-init.js"></script>
    <script>
        function showGoogleFeature() {
            showToast('Google login will be available soon!', false);
        }
        if (Api.isLoggedIn()) window.location.href = 'index.html';
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await Api.register(name, email, password);
                Api.setToken(res.token, res.user);
                showToast('Registration successful! Welcome.');
                setTimeout(() => window.location.href = 'index.html', 1500);
            } catch (error) {
                showToast(error.message, true);
            }
        });
    </script>
</body>
</html>
